<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>CRM Đơn Hàng</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: dark ink sidebar + light working sheet; order codes and money set in mono like a waybill. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#EBEFED; --line:#D9E0DD; --line-2:#C5CFCB;
  --ink:#14201C; --ink-2:#46554F; --muted:#76837E;
  --accent:#0D6B5B; --accent-ink:#FFFFFF; --accent-soft:#DCEEE9; --accent-line:#A9D3C8;
  --side:#11302A; --side-ink:#E4EFEB; --side-muted:#8FB0A7; --side-active:#1E4A41;
  --ok:#1E7440; --ok-soft:#DFF2E5; --warn:#9A5B00; --warn-soft:#FBEBCF; --bad:#B42318; --bad-soft:#FBE3E0;
  --info:#24569F; --info-soft:#E1EAF8; --neutral:#5E6B66; --neutral-soft:#E6EBE9;
  --shadow:0 12px 40px rgba(15,35,30,.18);
  --font:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1B2522; --line:#26332E; --line-2:#33433D;
  --ink:#E5ECE9; --ink-2:#AAB8B2; --muted:#7E8C86;
  --accent:#4EC2A7; --accent-ink:#04221B; --accent-soft:#163A32; --accent-line:#2A6457;
  --side:#0A110F; --side-ink:#DCE8E3; --side-muted:#7C9890; --side-active:#173530;
  --ok:#62CF8D; --ok-soft:#163323; --warn:#F0B24E; --warn-soft:#3A2B10; --bad:#F2857C; --bad-soft:#3D1C19;
  --info:#86AEF0; --info-soft:#1A2840; --neutral:#A2AFAA; --neutral-soft:#222D29;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1B2522; --line:#26332E; --line-2:#33433D;
  --ink:#E5ECE9; --ink-2:#AAB8B2; --muted:#7E8C86;
  --accent:#4EC2A7; --accent-ink:#04221B; --accent-soft:#163A32; --accent-line:#2A6457;
  --side:#0A110F; --side-ink:#DCE8E3; --side-muted:#7C9890; --side-active:#173530;
  --ok:#62CF8D; --ok-soft:#163323; --warn:#F0B24E; --warn-soft:#3A2B10; --bad:#F2857C; --bad-soft:#3D1C19;
  --info:#86AEF0; --info-soft:#1A2840; --neutral:#A2AFAA; --neutral-soft:#222D29;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
h4{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .sm{font-size:12px} .strong{font-weight:600} .nowrap{white-space:nowrap}
.row{display:flex;gap:8px;align-items:center} .row.wrap{flex-wrap:wrap} .row.end{justify-content:flex-end} .row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;
  padding-block:20px;padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:14px;overflow-y:auto}
.brand{padding:4px 10px 18px;display:flex;flex-direction:column;gap:6px}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--side-muted)}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--warn)} .mode.live i{background:var(--ok)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:7px;color:var(--side-ink);text-decoration:none;font-weight:500;white-space:nowrap;border:0;background:none;font:inherit;cursor:pointer;text-align:left}
.nav:hover{background:var(--side-active)}
.nav.on{background:var(--side-active);box-shadow:inset 3px 0 0 var(--accent)}
.nav .badge{font-size:11px;font-weight:700;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--bad);color:#fff;text-align:center}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:11px;color:var(--side-muted);line-height:1.45}

.main{padding-block:24px 64px;padding-left:28px;padding-right:max(24px, env(safe-area-inset-right, 0px));min-width:0}
.page-head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.page-head p{color:var(--ink-2);margin-top:4px;max-width:68ch}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb, var(--warn) 35%, transparent);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:13px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .lbl{font-size:12px;color:var(--ink-2);font-weight:500}
.kpi .val{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.alert .val{color:var(--bad)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%, transparent)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:34px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:500;color:var(--ink-2)}
.field .help{font-size:12px;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=search],input[type=url],select,textarea{
  width:100%;height:36px;padding:0 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink);font:inherit;min-width:0}
textarea{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.err,select.err{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
select:disabled{opacity:.6}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--accent)} .switch input:checked::after{left:19px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--neutral-soft);color:var(--neutral)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tone-ok{background:var(--ok-soft);color:var(--ok)} .tone-warn{background:var(--warn-soft);color:var(--warn)}
.tone-bad{background:var(--bad-soft);color:var(--bad)} .tone-info{background:var(--info-soft);color:var(--info)}
.tone-accent{background:var(--accent-soft);color:var(--accent)} .tone-neutral{background:var(--neutral-soft);color:var(--neutral)}
.tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:5px;font-size:11px;font-weight:600;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.tag.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)} .chip.on b{color:var(--bg)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--accent-soft);border-bottom:1px solid var(--accent-line);font-weight:500}

.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .mono{white-space:nowrap}
h2.mono{font-size:18px}
.tbl tr.clickable{cursor:pointer} .tbl tr.clickable:hover td{background:var(--surface-2)}
.tbl th.num{text-align:right}
.tbl.compact td,.tbl.compact th{padding:7px 8px}
.tbl td.chk,.tbl th.chk{width:36px;padding-right:0}
.tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.tbl input[type=text],.tbl input[type=number]{height:32px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--font);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover + .bar, .chart g:hover .bar{fill:color-mix(in srgb,var(--accent) 75%, var(--ink))}
.glist{display:flex;flex-direction:column}
.grow{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:10px;align-items:center;padding:7px 0;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:6px}
.grow:hover .gname{text-decoration:underline}
.gtrack{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.gfill{height:100%;border-radius:4px;background:var(--ink-2)}
.gfill.tone-ok{background:var(--ok)} .gfill.tone-warn{background:var(--warn)} .gfill.tone-bad{background:var(--bad)} .gfill.tone-info{background:var(--info)} .gfill.tone-accent{background:var(--accent)} .gfill.tone-neutral{background:var(--neutral)}
.gname{display:flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--neutral)}
.dot.tone-ok{background:var(--ok)} .dot.tone-warn{background:var(--warn)} .dot.tone-bad{background:var(--bad)} .dot.tone-info{background:var(--info)} .dot.tone-accent{background:var(--accent)}

.summary{position:sticky;top:16px}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.sumrow:last-of-type{border-bottom:0}
.sumrow span:last-child{font-variant-numeric:tabular-nums;font-weight:500}
.sumrow.total{border-top:1px solid var(--line-2);border-bottom:0;margin-top:6px;padding-top:12px;font-size:16px;font-weight:700}
.sumrow input{width:130px;height:30px;text-align:right}
.hint{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--info-soft);font-size:13px}
.hint.bad{background:var(--bad-soft)}
.hint.bad strong{color:var(--bad)}

.issue{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:16px;padding:16px;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:0}
.issue .reason{font-weight:600}
.issue.done{opacity:.6}

.drawer-scrim,.modal-scrim{position:fixed;inset:0;background:rgba(8,18,15,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dr-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.dr-body{padding:18px 20px 40px;overflow-y:auto;display:flex;flex-direction:column;gap:22px}
.dr-body section{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;margin:0}
.kv dt{color:var(--muted);font-size:13px} .kv dd{margin:0;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:5px}
.timeline li:last-child{border-left-color:transparent;padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.timeline li:first-child::before{background:var(--accent);border-color:var(--accent)}
.timeline .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.log{font-size:13px;display:flex;flex-direction:column;gap:6px}
.log div{display:flex;gap:10px} .log time{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}

.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px, calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--surface);border-radius:12px;z-index:51;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.modal-scrim{z-index:50}
.modal.narrow{width:min(460px, calc(100% - 32px))}
#toasts{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(420px, calc(100% - 32px))}
.toast{padding:11px 14px;border-radius:8px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-size:13px;font-weight:500;border-left:4px solid var(--info)}
.toast.tone-ok{border-left-color:var(--ok);background:var(--ink);color:var(--bg)} .toast.tone-bad{border-left-color:var(--bad);background:var(--ink);color:var(--bg)} .toast.tone-warn{border-left-color:var(--warn);background:var(--ink);color:var(--bg)}
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow)}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:12px 14px;line-height:1.55}
.note code,.mono-box{font-family:var(--mono);font-size:12px}
.mono-box{width:100%;min-height:160px;padding:10px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface-2);color:var(--ink)}
.cfg{max-width:900px}
.wh{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.wh.on{border-color:var(--accent);background:var(--accent-soft)}
.ok-txt{color:var(--ok)} .bad-txt{color:var(--bad)} .warn-txt{color:var(--warn)}

@media (max-width:1100px){ .split{grid-template-columns:1fr} .summary{position:static} }
@media (max-width:860px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding-block:8px;padding-right:max(14px, env(safe-area-inset-right,0px));z-index:30;gap:4px}
  .brand{padding:0 8px 0 2px;flex-direction:row;align-items:center}
  .brand b{font-size:15px}
  .side-foot{display:none}
  .nav{padding:7px 10px}
  .nav.on{box-shadow:inset 0 -3px 0 var(--accent)}
  .main{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:18px 64px}
  .grid2,.grid3,.issue{grid-template-columns:1fr}
  .hide-sm{display:none}
  .kv{grid-template-columns:110px minmax(0,1fr)}
  .grow{grid-template-columns:120px minmax(0,1fr) 36px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>

<div class="app">
  <nav class="side" id="side" aria-label="Điều hướng"></nav>
  <main class="main" id="main"></main>
</div>
<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<div id="tip" class="tip" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* ============================================================
   CRM Đơn Hàng – kết nối SuperShip API (HTML/CSS/JS thuần)
   Dữ liệu lưu trong DB SQLite qua server.js (API /api/state).

let saveT, saving = null, saved = {meta:'', products:'', orders:new Map(), customers:new Map()}, replaceNext = false;
const metaOf = () => { const m = Object.assign({}, S); delete m.products; delete m.orders; delete m.customers; return m; };
function snapshot(){
  return { meta:JSON.stringify(metaOf()), products:JSON.stringify(S.products),
    orders:new Map(S.orders.map(o => [o.id, JSON.stringify(o)])), customers:new Map(Object.entries(S.customers).map(([k, v]) => [k, JSON.stringify(v)])) };
}
function markSaved(){ saved = snapshot(); }
function diff(cur){
  const ch = {}; let n = 0; let base = saved;
  if (replaceNext) { ch.replace = true; base = {meta:'', products:'', orders:new Map(), customers:new Map()}; }
  if (cur.meta !== base.meta) { ch.meta = JSON.parse(cur.meta); n++; }
  if (cur.products !== base.products) { ch.products = JSON.parse(cur.products); n++; }
  for (const [id, j] of cur.orders) if (base.orders.get(id) !== j) { (ch.orders = ch.orders || []).push(JSON.parse(j)); n++; }
  for (const id of base.orders.keys()) if (!cur.orders.has(id)) { (ch.deleteOrders = ch.deleteOrders || []).push(id); n++; }
  for (const [k, j] of cur.customers) if (base.customers.get(k) !== j) { (ch.customers = ch.customers || {})[k] = JSON.parse(j); n++; }
  for (const k of base.customers.keys()) if (!cur.customers.has(k)) { (ch.deleteCustomers = ch.deleteCustomers || []).push(k); n++; }
  return n || ch.replace ? ch : null;
}
async function flush(throwErr){
  clearTimeout(saveT);
  if (saving) { await saving.catch(() => {}); }
  const cur = snapshot(); const ch = diff(cur); if (!ch) return;
  saving = fetch('api/state', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(ch)})
    .then(async r => { if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'HTTP ' + r.status); saved = cur; replaceNext = false; UI.saveErr = false; });
  try { await saving; }
  catch(e) { if (throwErr) throw e; if (!UI.saveErr) toast('Chưa lưu được vào DB: ' + e.message + '. Sẽ thử lại.', 'bad', 6000); UI.saveErr = true; saveT = setTimeout(flush, 5000); }
  finally { saving = null; }
}

function parseSkuText(text){
  return String(text||'').split('+').map(s => s.trim()).filter(Boolean).map(raw => {
    let code = raw.replace(/\s+/g,''); let mult = 1;
    const suf = code.match(/^(.+?)[*x×](\d+)$/i);
    if (suf && findProduct(suf[1].replace(/^\d+(?=\D)/,'')) ) { mult *= +suf[2]; code = suf[1]; }
    if (!findProduct(code)) { const m = code.match(/^(\d+)(\D.*)$/); if (m) { mult *= +m[1]; code = m[2]; } }
    const p = findProduct(code);
    return { raw, sku: p ? p.sku : code.toUpperCase(), mult, product: p };
  });
}

async function api(method, path, {query, body} = {}){
  if (S.settings.demo) return mockApi(method, path, query || {}, body || {});
  if (!S.settings.token) throw new Error('Chưa có token. Vào Cài đặt → Kết nối để nhập token SuperShip.');
  let url = String(S.settings.apiBase || 'https://api.mysupership.vn').replace(/\/$/,'') + path;
  if (query) url += '?' + new URLSearchParams(query);
  let res;
  try {
    res = await fetch(url, { method, headers: Object.assign({'Accept':'application/json','Authorization':'Bearer ' + S.settings.token}, body ? {'Content-Type':'application/json'} : {}), body: body ? JSON.stringify(body) : undefined });
  } catch(e) {
    throw new Error('Không kết nối được tới SuperShip. Trình duyệt có thể bị chặn gọi trực tiếp (CORS) – xem hướng dẫn proxy trong Cài đặt.');
  }
  let data = null; try { data = await res.json(); } catch(e) {}
  const okFlag = data && data.status ? String(data.status).toLowerCase() === 'success' : res.ok;
  if (!res.ok || !okFlag){
    const msg = data && (data.message || data.error || (data.errors && JSON.stringify(data.errors)));
    if (res.status === 401) throw new Error('Token không hợp lệ hoặc đã hết hạn (401). Lấy lại token tại khachhang.supership.vn/apis.');
    throw new Error(msg || ('SuperShip trả lỗi HTTP ' + res.status));
  }
  return data;
}

  const r = await api('POST','/v1/partner/orders/add',{body:buildPayload(o)});
  const res = r.results || r;

async function syncOrder(o){

async function runMany(list, fn, label){

  UI.busy = true; let ok = 0, fail = 0, lastErr = '';
  const t = toast(`${label}: 0/${list.length}`, 'info', 60000);

    try { if (await fn(list[i]) !== false) ok++; } catch(e) { fail++; lastErr = e.message; }

  t.remove(); UI.busy = false; save();

  const r = await runMany(list, async o => { if (await syncOrder(o)) changed++; }, 'Cập nhật trạng thái');
  if (!silent || changed) toast(`Đã kiểm tra ${r.ok} đơn, ${changed} đơn đổi trạng thái.`, 'ok');

function customerMap(){
  const m = new Map();
  const sorted = [...S.orders].sort((a,b) => a.createdAt < b.createdAt ? -1 : 1);
  for (const o of sorted){
    const ph = o.receiver.phone; let c = m.get(ph);
    if (!c){ c = {phone:ph, orders:[], ok:0, ret:0, active:0, cancelled:0, spent:0}; m.set(ph, c); }
    c.name = o.receiver.name; c.receiver = o.receiver; c.last = o.createdAt; c.orders.push(o);
    const g = groupOf(o.status).id;
    if (g === 'success'){ c.ok++; c.spent += +o.amount || 0; }
    else if (RETURN_GROUPS.includes(g)) c.ret++;
    else if (g === 'cancelled') c.cancelled++;
    else c.active++;
  }
  for (const c of m.values()){
    const meta = S.customers[c.phone] || {}; c.tags = meta.tags || []; c.note = meta.note || '';
    c.rate = c.ok + c.ret ? c.ok / (c.ok + c.ret) : null;
    c.risk = c.tags.includes('Bom hàng') || c.ret >= 2 || (c.ret >= 1 && c.rate < .5);
  }
  return m;
}

  });

function niceMax(v){ if (v <= 4) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1,2,2.5,5,10]) if (m*p >= v) return m*p; return 10*p; }

  const nt = max % 4 === 0 ? 4 : 5; const ticks = Array.from({length:nt+1}, (_, i) => max/nt*i);
  const y = v => T + ph - v / max * ph;
  const bar = (x, yy, w, h) => { const r = Math.min(4, w/2, h); if (h <= 0) return ''; return `M${x},${yy+h}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+w-r}Q${x+w},${yy} ${x+w},${yy+r}V${yy+h}Z`; };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Số đơn tạo mỗi ngày trong 14 ngày">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${Number.isInteger(v)?v:v.toFixed(1)}</text>`).join('')}
    ${days.map((d, i) => { const x = L + step*i + (step-bw)/2; const h = d.n / max * ph;
      return `<g><path class="bar" d="${bar(x, y(d.n), bw, h)}"/><rect class="hit" x="${L+step*i}" y="${T}" width="${step}" height="${ph}" data-tip="${fmtDay(d.d)}: ${d.n} đơn · COD ${fmtMoney(d.cod)}"/>${i % 2 === (days.length-1) % 2 ? `<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${fmtDay(d.d)}</text>` : ''}</g>`; }).join('')}
  </svg>`;
}

    if (my !== feeSeq || UI.form !== f) return;

    f.fee = res ? {shipment:+res.fee||0, insurance:+res.insurance||0, eta:res.delivery && res.delivery.name} : null;

    <button type="button" class="btn sm" data-act="fill-cust" data-phone="${esc(ph)}">Điền địa chỉ cũ</button></div>`;

async function submitForm(push){
  const f = UI.form; const errs = [];
  const need = [['receiver.phone','#f-phone'],['receiver.name','#f-name'],['receiver.address','#f-addr']];
  need.forEach(([k, sel]) => { const [a,b] = k.split('.'); if (!String(f[a][b]).trim()){ errs.push(sel); } });
  const phone = normPhone(f.receiver.phone);
  if (phone && (phone.length < 9 || phone.length > 11)) errs.push('#f-phone');
  ['province','district','commune'].forEach((k, i) => { if (!f.receiver[k]) errs.push(['#rc-prov','#rc-dist','#rc-comm'][i]); });
  const items = f.items.filter(i => i.sku);
  const badItem = !items.length || items.some(i => !findProduct(i.sku) || !(+i.qty > 0));
  errs.forEach(s => $(s) && $(s).classList.add('err'));
  if (errs.length || badItem){ toast(badItem ? 'Kiểm tra lại sản phẩm: cần ít nhất 1 SKU hợp lệ và số lượng > 0.' : 'Điền đủ các ô có dấu * và chọn đủ tỉnh, quận, phường.', 'bad'); return; }
  const t = totalsOf(f); const now = new Date().toISOString();
  let o = UI.editId ? S.orders.find(x => x.id === UI.editId) : null;
  if (!o){ o = {id:uid(), soc:nextSoc(now), createdAt:now, status:'draft', journeys:[], ssNotes:[], log:[], issue:{handled:false, note:''}, fee:{shipment:0, insurance:0, return:0}}; S.orders.unshift(o); addLog(o, 'Tạo đơn nháp'); }
  else addLog(o, 'Sửa đơn nháp');
  Object.assign(o, {receiver:{...f.receiver, phone, name:f.receiver.name.trim(), address:f.receiver.address.trim()}, items:items.map(i => ({...i, qty:+i.qty, price:+i.price})), subtotal:t.subtotal, amount:t.amount, value:t.value, weight:t.weight, cost:t.cost, payer:f.payer, config:f.config, note:f.note.trim(), updatedAt:now});
  if (f.fee) o.fee = {shipment:f.fee.shipment, insurance:f.fee.insurance, return:0};
  save();
  const btns = $$('#sum button'); btns.forEach(b => b.disabled = true);
  if (push){
    try { await pushOrder(o); toast(`Đã tạo đơn ${o.soc} trên SuperShip (${o.ssCode}).`, 'ok'); }
    catch(e){ toast('Đã lưu nháp nhưng chưa đẩy được: ' + e.message, 'bad', 8000); }
  } else toast(`Đã lưu nháp ${o.soc}.`, 'ok');
  UI.form = blankForm(); UI.editId = null; UI.drawer = {type:'order', id:o.id};
  go('orders');
}

async function initAreaPicker(p, val, onChange){
  const ps = $('#'+p+'-prov'), ds = $('#'+p+'-dist'), cs = $('#'+p+'-comm'); if (!ps) return;
  const fill = (sel, list, cur, ph) => { sel.innerHTML = `<option value="">${ph}</option>` + list.map(x => `<option value="${esc(x.code)}" ${x.name === cur ? 'selected' : ''}>${esc(x.name)}</option>`).join(''); sel.disabled = !list.length; };
  const txt = s => s.value ? s.selectedOptions[0].text : '';
  const emit = () => onChange({province:txt(ps), district:txt(ds), commune:txt(cs)});
  try {
    fill(ps, await areaProvinces(), val.province, 'Chọn tỉnh/thành');
    if (ps.value){ fill(ds, await areaDistricts(ps.value), val.district, 'Chọn quận/huyện'); if (ds.value) fill(cs, await areaCommunes(ds.value), val.commune, 'Chọn phường/xã'); }
  } catch(e) { ps.innerHTML = '<option value="">Không tải được danh mục</option>'; toast(e.message, 'bad'); }
  ps.onchange = async () => { ps.classList.remove('err'); fill(ds, [], '', 'Đang tải…'); fill(cs, [], '', 'Chọn quận trước'); emit(); if (ps.value){ try { fill(ds, await areaDistricts(ps.value), '', 'Chọn quận/huyện'); } catch(e){ toast(e.message,'bad'); } } };
  ds.onchange = async () => { ds.classList.remove('err'); fill(cs, [], '', 'Đang tải…'); emit(); if (ds.value){ try { fill(cs, await areaCommunes(ds.value), '', 'Chọn phường/xã'); } catch(e){ toast(e.message,'bad'); } } };
  cs.onchange = () => { cs.classList.remove('err'); emit(); };
}

  const waitL = S.orders.filter(o => ['12','13'].includes(o.status)).sort((a,b) => deliveredAt(a) < deliveredAt(b) ? -1 : 1);

const IMPORT_HEADERS = ['Tên người nhận','Số điện thoại','Địa chỉ','Phường/Xã','Quận/Huyện','Tỉnh/Thành phố','SKU','Thu hộ (COD)','Ghi chú'];
const normKey = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]/g,'');
const KEYMAP = {tennguoinhan:'name', ten:'name', hoten:'name', nguoinhan:'name', sodienthoai:'phone', sdt:'phone', dienthoai:'phone', diachi:'address', phuongxa:'commune', phuong:'commune', xa:'commune', quanhuyen:'district', quan:'district', huyen:'district', tinhthanhpho:'province', tinh:'province', tinhthanh:'province', thanhpho:'province', sku:'sku', masp:'sku', sanpham:'sku', thuhocod:'amount', thuho:'amount', cod:'amount', ghichu:'note'};
function openImport(){
  openModal(`<div class="row between"><h3>Nhập đơn từ Excel</h3><button class="icon-btn" data-act="modal-close" aria-label="Đóng">×</button></div>
    <p class="muted">Mỗi dòng là một đơn. Cột SKU có thể ghi nhiều sản phẩm, vd <span class="mono">2ROUGAL + 1PHANA-1L</span>. Để trống cột Thu hộ thì lấy theo giá bán. Đơn được tạo ở dạng nháp để bạn kiểm tra rồi đẩy hàng loạt.</p>
    <div class="tbl-wrap"><table class="tbl compact"><thead><tr>${IMPORT_HEADERS.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody><tr><td>Nguyễn Văn A</td><td class="mono">0912345678</td><td>45 Lê Lợi</td><td>Phường Bến Thành</td><td>Quận 1</td><td>Thành phố Hồ Chí Minh</td><td class="mono">2ROUGAL</td><td></td><td>Gọi trước</td></tr></tbody></table></div>
    <div class="row wrap">${isEmbedded ? `<button class="btn sm" data-act="copy" data-text="${esc(IMPORT_HEADERS.join('\t'))}">Sao chép dòng tiêu đề để dán vào Excel</button>` : `<button class="btn sm" data-act="tpl-download">Tải file mẫu</button>`}
      <label class="btn primary" for="imp-file">Chọn file Excel / CSV</label><input type="file" id="imp-file" accept=".xlsx,.xls,.csv" hidden></div>
    <div id="imp-out"></div>`);
  $('#imp-file').onchange = e => { const file = e.target.files[0]; if (file) readImport(file); };
}
function readImport(file){
  const rd = new FileReader();
  rd.onload = () => {
    try {
      if (typeof XLSX === 'undefined') throw new Error('Không tải được thư viện đọc Excel. Kiểm tra kết nối mạng rồi thử lại.');
      const wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:'', raw:false});
      UI.importRows = rows.map(raw => {
        const r = {}; for (const [k, v] of Object.entries(raw)){ const key = KEYMAP[normKey(k)]; if (key) r[key] = String(v).trim(); }
        const errs = []; ['name','phone','address','commune','district','province','sku'].forEach(k => { if (!r[k]) errs.push('thiếu ' + {name:'tên',phone:'SĐT',address:'địa chỉ',commune:'phường/xã',district:'quận/huyện',province:'tỉnh',sku:'SKU'}[k]); });
        const phone = normPhone(r.phone); if (r.phone && (phone.length < 9 || phone.length > 11)) errs.push('SĐT sai');
        const parts = parseSkuText(r.sku); const bad = parts.filter(p => !p.product); if (bad.length) errs.push('không có SKU ' + bad.map(b => b.sku).join(', '));
        const items = []; parts.filter(p => p.product).forEach(p => { const ex = items.find(i => i.sku === p.sku); if (ex) ex.qty += p.mult; else items.push(itemFromProduct(p.product, p.mult)); });
        const t = calcItems(items); const amt = r.amount ? +String(r.amount).replace(/[^\d]/g,'') : t.subtotal;
        return {r:{...r, phone}, items, t, amount:amt, errs};
      }).filter(x => Object.keys(x.r).length > 1);
      renderImportPreview();
    } catch(e) { $('#imp-out').innerHTML = `<p class="bad-txt">${esc(e.message)}</p>`; }
  };
  rd.readAsArrayBuffer(file);
}
function renderImportPreview(){
  const rows = UI.importRows || []; const good = rows.filter(x => !x.errs.length);
  $('#imp-out').innerHTML = `<div class="row between wrap"><strong>${rows.length} dòng · ${good.length} hợp lệ${rows.length - good.length ? ` · <span class="bad-txt">${rows.length - good.length} lỗi</span>` : ''}</strong>
    <button class="btn primary" data-act="import-create" ${good.length?'':'disabled'}>Tạo ${good.length} đơn nháp</button></div>
    <div class="tbl-wrap" style="max-height:320px;overflow:auto"><table class="tbl compact"><thead><tr><th>#</th><th>Người nhận</th><th>Địa chỉ</th><th>Sản phẩm</th><th class="num">Thu hộ</th><th>Kiểm tra</th></tr></thead><tbody>
    ${rows.map((x, i) => `<tr><td>${i+2}</td><td>${esc(x.r.name)}<div class="mono muted sm">${esc(x.r.phone)}</div></td><td class="sm">${esc([x.r.address, x.r.commune, x.r.district, x.r.province].filter(Boolean).join(', '))}</td><td class="mono sm">${esc(x.items.map(i => i.qty+'× '+i.sku).join(', ') || x.r.sku)}</td><td class="num">${fmtMoney(x.amount)}</td><td>${x.errs.length ? `<span class="bad-txt sm">${esc(x.errs.join('; '))}</span>` : '<span class="ok-txt sm">OK</span>'}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function createImported(){
  const good = (UI.importRows || []).filter(x => !x.errs.length); const now = new Date().toISOString();
  good.forEach(x => {
    const o = {id:uid(), soc:nextSoc(now), createdAt:now, updatedAt:now, status:'draft', journeys:[], ssNotes:[], log:[], issue:{handled:false, note:''}, fee:{shipment:0, insurance:0, return:0},
      receiver:{name:x.r.name, phone:x.r.phone, address:x.r.address, province:x.r.province, district:x.r.district, commune:x.r.commune}, items:x.items,
      subtotal:x.t.subtotal, amount:x.amount, value:x.t.subtotal, weight:x.t.weight, cost:x.t.cost, payer:S.settings.payer, config:S.settings.config, note:x.r.note || ''};
    addLog(o, 'Nhập từ Excel'); S.orders.unshift(o); UI.sel.add(o.id);
  });
  save(); closeModal(); UI.importRows = null; UI.group = 'draft';
  toast(`Đã tạo ${good.length} đơn nháp và chọn sẵn. Bấm “Đẩy lên SuperShip” để gửi.`, 'ok', 6000); go('orders');
}

  'cust-new-order': a => { const c = customerMap().get(a.dataset.phone); UI.form = blankForm(); UI.form.receiver = {...c.receiver}; UI.editId = null; closeDrawer(); go('new-order'); },
  'prod-add': () => { S.products.push({sku:'SKU' + (S.products.length + 1), name:'Sản phẩm mới', price:0, cost:0, weight:500}); save(); render(); const ins = $$('[data-f="sku"]'); ins[ins.length-1].select(); },
  'prod-del': a => { const p = S.products[+a.dataset.i]; confirmBox('Xoá sản phẩm ' + p.sku + '?', 'Các đơn cũ vẫn giữ thông tin sản phẩm này.', 'Xoá', () => { S.products.splice(+a.dataset.i, 1); save(); render(); }, true); },
  'cfg-test': async a => { const out = $('#cfg-test-out'); out.className = 'sm'; out.textContent = 'Đang kiểm tra…'; a.disabled = true;
    try { const r = await api('GET','/v1/partner/orders/status'); out.className = 'sm ok-txt'; out.textContent = `Kết nối được${S.settings.demo ? ' (demo)' : ''}: nhận ${(r.results||[]).length} trạng thái đơn.`; } catch(e) { out.className = 'sm bad-txt'; out.textContent = e.message; } a.disabled = false; },
  'cfg-wh-load': async a => { a.disabled = true; try { const r = await api('GET','/v1/partner/warehouses'); UI.warehouses = r.results || []; renderWarehouses(); } catch(e) { toast(e.message, 'bad'); } a.disabled = false; },
  'cfg-wh-pick': a => { const w = UI.warehouses.find(x => x.code === a.dataset.code); const p = S.settings.pickup; p.code = w.code; p.name = w.name; p.address = w.address || p.address; save(); toast('Đã chọn ' + w.name + '. Kiểm tra lại tỉnh, quận, phường của kho bên dưới.', 'ok', 5000); render(); },
  'cfg-export': () => exportData(),
  'cfg-clear-sample': () => confirmBox('Xoá dữ liệu mẫu?', 'Xoá toàn bộ đơn và khách mẫu, tắt chế độ demo. Danh sách sản phẩm mẫu được giữ lại để bạn sửa giá cho đúng.', 'Xoá dữ liệu mẫu', () => { S.orders = []; S.customers = {}; S.sample = false; S.seq = 0; S.settings.demo = false; S.settings.pickup = defaults().settings.pickup; save(); toast('Đã xoá dữ liệu mẫu. Nhập token và kho lấy hàng để bắt đầu.', 'ok', 6000); render(); }),
  'cfg-clear-all': () => confirmBox('Xoá toàn bộ dữ liệu?', 'Tất cả đơn, khách, sản phẩm và cài đặt trong DB sẽ bị xoá. Đơn trên SuperShip không bị ảnh hưởng.', 'Xoá hết', () => { S = defaults(); S.settings.demo = false; saveReplace(); render(); }, true),
};
document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-act]:not(tr)')) return;
  const a = e.target.closest('[data-act]'); if (!a) return;
  const fn = H[a.dataset.act]; if (!fn) return;
  if (a.tagName === 'BUTTON' || a.tagName === 'A') e.preventDefault();
  fn(a, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.sel){ t.checked ? UI.sel.add(t.dataset.sel) : UI.sel.delete(t.dataset.sel); renderOrdersBody(); }
  else if (t.dataset.prod !== undefined){ const p = S.products[+t.dataset.prod]; const f = t.dataset.f; let v = t.value.trim();
    if (f === 'sku'){ v = v.toUpperCase().replace(/\s+/g,''); if (!v || S.products.some((x, i) => i !== +t.dataset.prod && x.sku === v)){ toast('SKU trống hoặc bị trùng.', 'bad'); t.value = p.sku; return; } t.value = v; }
    p[f] = ['price','cost','weight'].includes(f) ? Math.max(0, +v || 0) : v; save(); }
  else if (t.id === 'cust-note'){ custMeta(t.dataset.phone).note = t.value.trim(); save(); toast('Đã lưu ghi chú khách.', 'ok', 1500); }
  else if (t.id === 'show-done'){ UI.showDone = t.checked; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if ($('#modal-root').innerHTML) closeModal(); else if (UI.drawer) closeDrawer(); } });
// tooltip biểu đồ
const tip = $('#tip');
document.addEventListener('mousemove', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (!t){ tip.hidden = true; return; } tip.textContent = t.dataset.tip; tip.hidden = false; const w = tip.offsetWidth; tip.style.left = Math.min(window.innerWidth - w - 8, e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 34) + 'px'; });
window.addEventListener('hashchange', () => { if (!S) return; closeModal(); render(); window.scrollTo(0, 0); });

// tự cập nhật trạng thái
setInterval(() => { if (!S) return; const m = +S.settings.autoSync; if (!m || UI.busy) return; if (Date.now() - UI.lastAuto < m*60000) return; UI.lastAuto = Date.now(); syncMany(activeOrders(), true); }, 30000);

load().then(() => {
  render();
  if (UI.migrated) toast(`Đã chuyển ${UI.migrated} đơn từ trình duyệt vào DB.`, 'ok', 6000);
}).catch(e => {
  $('#main').innerHTML = `<div class="panel"><div class="panel-b stack"><h3>Không kết nối được server</h3><p class="muted">${esc(e.message)}. Hãy chạy <span class="mono">node server.js</span> rồi mở trang qua địa chỉ server (vd. http://localhost:3005), không mở file HTML trực tiếp.</p></div></div>`;
});
</script>
</body></html>
